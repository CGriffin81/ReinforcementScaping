# E4's evaluation: the 5 PPO + RND models on E1's 30 seeds with sampled actions (OQ-65 (4)), beside E1's four
# baselines on the same seeds. Run after training. Without RND, the same agent is E3's (.5, .5)
# (normalised_weights0.5-0.5/seed<k> in E3's summary): an episode depends only on the policy and the seed (OQ-64,
# OQ-65 (4)), so E3's evaluated episodes pair with these seed for seed. The bonus plays no part in an evaluation.
#   uv run python scripts/evaluate.py --config configs/e4-rnd-exploration-eval.yaml
#   uv run python scripts/publish_summary.py results/eval/e4-rnd-exploration e4-rnd-exploration
policies:
  - random
  - greedy_xp
  - greedy_wealth
  - scripted_guide
  - rnd/seed0=ppo:runs/e4-rnd-exploration/seed0/model.zip
  - rnd/seed1=ppo:runs/e4-rnd-exploration/seed1/model.zip
  - rnd/seed2=ppo:runs/e4-rnd-exploration/seed2/model.zip
  - rnd/seed3=ppo:runs/e4-rnd-exploration/seed3/model.zip
  - rnd/seed4=ppo:runs/e4-rnd-exploration/seed4/model.zip
seeds: 30
hours: 20
workers: 16
out: results/eval/e4-rnd-exploration
