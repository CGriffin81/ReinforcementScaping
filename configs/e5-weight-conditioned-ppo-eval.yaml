# E5's evaluation (OQ-74 (c)): each of the 5 weight-conditioned models at 13 weightings, E3's five and every 0.1
# in between (the skill share u after the @; the wealth share is 1 - u), on E1's 30 seeds with sampled actions
# (OQ-65 (4)), beside E1's four baselines on the same seeds. At u = 1, .75, .5, .25 and 0 an episode pairs, seed
# for seed, with E3's agent trained for that weighting alone (E3's summary). The front between them is for
# coverage and hypervolume. 1,950 episodes of E5's: about 1.5 hours with 16 workers.
