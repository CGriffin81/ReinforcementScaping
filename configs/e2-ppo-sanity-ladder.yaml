# E2, the sanity ladder (OQ-65 and OQ-66, Caleb, 2026-11-09), rung 3: the sweep at weights (.5, .5), GAE lambda by
# learning rate (OQ-66: rung 1 found lambda 0.95 under-invests), entropy 0.01. Its best variant by
# evaluated reward on E1's seeds answers rung 2, PPO against random (configs/e2-ppo-sanity-ladder-eval.yaml), and is
# what E3 to E6 use. Four runs of 4 envs at once make about 1M decisions an hour in all.
#   uv run python scripts/train.py --config configs/e2-ppo-sanity-ladder.yaml --jobs 4
#   uv run python scripts/publish_training.py runs/e2-ppo-sanity-ladder e2-ppo-sanity-ladder
seeds: [0, 1]
total_decisions: 1_000_000
n_envs: 4
vec_env: subproc
device: cpu
torch_threads: 2
env: {reward_weights: [0.5, 0.5]}
ppo:
  gamma_hr: 0.99
  ent_coef: 0.01
  n_steps: 256
  batch_size: 1024
  n_epochs: 4
  policy_kwargs: {net_arch: [256, 256]}
sweep:
  ppo.gae_lambda: [0.95, 0.99]
  ppo.learning_rate: [1.0e-4, 3.0e-4]
checkpoint_every: 100_000
decision_log: true
