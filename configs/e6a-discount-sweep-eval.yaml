# E6a's evaluation: the sweep's 10 models (gamma_hr 0.5 and 0.9 x five seeds) on E1's 30 seeds with sampled actions
# (OQ-65 (4)), beside E1's four baselines on the same seeds. Run after the sweep has trained.
# gamma_hr 0.99 is E3's (.5, .5) (normalised_weights0.5-0.5/seed<k> in E3's summary): an episode depends only on the
# policy and the seed (OQ-64, OQ-65 (4)), so E3's evaluated episodes pair with these seed for seed.
#   uv run python scripts/evaluate.py --config configs/e6a-discount-sweep-eval.yaml
#   uv run python scripts/publish_summary.py results/eval/e6a-discount-sweep e6a-discount-sweep
policies:
  - random
  - greedy_xp
  - greedy_wealth
  - scripted_guide
  - gamma_hr0.5/seed0=ppo:runs/e6a-discount-sweep/gamma_hr0.5/seed0/model.zip
  - gamma_hr0.5/seed1=ppo:runs/e6a-discount-sweep/gamma_hr0.5/seed1/model.zip
  - gamma_hr0.5/seed2=ppo:runs/e6a-discount-sweep/gamma_hr0.5/seed2/model.zip
  - gamma_hr0.5/seed3=ppo:runs/e6a-discount-sweep/gamma_hr0.5/seed3/model.zip
  - gamma_hr0.5/seed4=ppo:runs/e6a-discount-sweep/gamma_hr0.5/seed4/model.zip
  - gamma_hr0.9/seed0=ppo:runs/e6a-discount-sweep/gamma_hr0.9/seed0/model.zip
  - gamma_hr0.9/seed1=ppo:runs/e6a-discount-sweep/gamma_hr0.9/seed1/model.zip
  - gamma_hr0.9/seed2=ppo:runs/e6a-discount-sweep/gamma_hr0.9/seed2/model.zip
  - gamma_hr0.9/seed3=ppo:runs/e6a-discount-sweep/gamma_hr0.9/seed3/model.zip
  - gamma_hr0.9/seed4=ppo:runs/e6a-discount-sweep/gamma_hr0.9/seed4/model.zip
seeds: 30
hours: 20
workers: 16
out: results/eval/e6a-discount-sweep
