# E3, the reward-weight sweep (RQ1 to RQ3; ROADMAP's finishing plan): PPO at five weightings, 5 seeds each.
# - The weights are in normalised units (OQ-67, Caleb, 2026-11-10): E1's best 20-hour gain on each objective, the
#   guide's 323.87 levels and greedy GP/hr's 1.89M gp, converted to SimEnv's by rlscape/envs/weights.py. The
#   normalised (.5, .5) is SimEnv's (.5, 9.18) on sim v1.2.
# - 2M decisions a run (OQ-69).
# - E2's winner (OQ-65 (2)): GAE lambda 0.95, learning rate 3e-4, entropy 0.01.
# 25 runs, four at once: about 50 hours. Every run keeps its 1M checkpoint (checkpoint_every).
#   uv run python scripts/train.py --config configs/e3-reward-weight-sweep.yaml --jobs 4
#   uv run python scripts/publish_training.py runs/e3-reward-weight-sweep e3-reward-weight-sweep
seeds: [0, 1, 2, 3, 4]
total_decisions: 2_000_000
n_envs: 4
vec_env: subproc
device: cuda  # the GPU, deterministically (Caleb, OQ-80 (a))
torch_threads: 2
ppo:
  bootstrap_horizon: false  # the horizon is the task's end (env contract v1.46, 2026-11-15, m002-rerun)
  discount_floor_ticks: 100  # each decision discounts as at least a game-minute (v1.46)
  gamma_hr: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  ent_coef: 0.01
  n_steps: 256
  batch_size: 1024
  n_epochs: 4
  policy_kwargs: {net_arch: [256, 256]}
sweep:
  env.normalised_weights: [[1.0, 0.0], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.0, 1.0]]
checkpoint_every: 100_000
decision_log: true
