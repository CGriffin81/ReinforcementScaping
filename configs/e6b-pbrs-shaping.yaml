# E6b, PBRS (RQ4; ROADMAP's finishing plan): PPO with potential-based reward shaping at the normalised (.5, .5),
# 5 seeds, against E3's (.5, .5), which is the same config without shaping (raw reward).
# - Every setting but `pbrs` is E3's (.5, .5): seeds 0 to 4, 2M decisions (OQ-69), E2's winner (OQ-65 (2)), the
#   normalised weights (OQ-67; SimEnv's (.5, 9.18) on sim v1.2), gamma_hr 0.99. So E3's runs at (.5, .5) are E6b's
#   baseline, seed for seed.
# - The potential (rlscape/agents/pbrs.py; Caleb, 2026-11-10, OQ-73): the discounted wealth reward that the best
#   gathering income the character's levels and unlocks allow would earn in the time left. The shaping
#   F = gamma_hr^tau Phi(s') - Phi(s) uses the agent's own gamma_hr, so the best policy is the unshaped one's.
# 5 runs, four at once: about 17 hours.
#   uv run python scripts/train.py --config configs/e6b-pbrs-shaping.yaml --jobs 4
#   uv run python scripts/publish_training.py runs/e6b-pbrs-shaping e6b-pbrs-shaping
seeds: [0, 1, 2, 3, 4]
total_decisions: 2_000_000
n_envs: 4
vec_env: subproc
device: cpu
torch_threads: 2
env:
  normalised_weights: [0.5, 0.5]
ppo:
  gamma_hr: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  ent_coef: 0.01
  n_steps: 256
  batch_size: 1024
  n_epochs: 4
  policy_kwargs: {net_arch: [256, 256]}
pbrs:
  potential: gathering_income
checkpoint_every: 100_000
decision_log: true
