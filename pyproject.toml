[project]
name = "rlscape"
version = "0.1.0"
description = "Hierarchical RL for skill and wealth accumulation in 2009Scape (CS898BG project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "sb3-contrib>=2.9.2",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlscape"]

# torch: PyTorch's CUDA 13.0 wheel (Caleb, 2026-11-08: CUDA torch for the RTX 3050; the driver supports CUDA 13.4),
# installed from wheels/, where scripts/fetch_torch_wheel.py downloads it with resumes and checks its SHA-256: uv's
# own download breaks on this connection (a TLS decrypt error partway) and can't resume
[[tool.uv.index]]
name = "local-wheels"
url = "./wheels"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "local-wheels" }]
